<!DOCTYPE html>
<html>
<head>
  
<meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
body { margin:0; overflow:hidden; }

video {
  position:fixed;
  width:100vw;
  height:100vh;
  object-fit:cover;
  transform: scaleX(-1);
  z-index:1;
}

canvas {
  position:fixed;
  top:0; left:0;
  width:100vw;
  height:100vh;
  z-index:2;
}
</style>
</head>

<body>

<video id="cam" autoplay muted playsinline></video>
<canvas id="cvs"></canvas>

<script>
const video = document.getElementById("cam");
const canvas = document.getElementById("cvs");
const ctx = canvas.getContext("2d");

let face = null;

// camera
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "user" }
}).then(s => video.srcObject = s);

// resize
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resize;
resize();

// ===== FaceMesh =====
const mesh = new FaceMesh({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});

mesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

mesh.onResults(res => {
  if (res.multiFaceLandmarks.length > 0) {
    face = res.multiFaceLandmarks[0];
  }
});

// ===== MAP =====
function map(p){
  return {
    x: canvas.width - p.x * canvas.width,
    y: p.y * canvas.height
  };
}

// ===== LOOP =====
async function loop() {
  await mesh.send({ image: video });

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // vẽ test giữa màn hình
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, 30, 0, Math.PI*2);
  ctx.fill();

  // nếu có mặt
  if (face) {
    const leftEye = map(face[33]);
    const rightEye = map(face[263]);

    // vẽ mắt
    ctx.fillStyle = "lime";

    ctx.beginPath();
    ctx.arc(leftEye.x, leftEye.y, 10, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(rightEye.x, rightEye.y, 10, 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}

video.addEventListener("loadeddata", () => {
  loop();
});
    </script>
</body>
</html>
