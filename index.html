<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Filter by Kris Artura</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        /* Thiết lập giao diện toàn màn hình, không có thanh cuộn */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Container chứa Camera và Canvas */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video ẩn ở dưới, chỉ dùng để lấy luồng dữ liệu */
        .input_video {
            display: none;
            position: absolute;
        }

        /* Canvas (Can vát) hiển thị hình ảnh đã qua xử lý Filter (Phin tờ) */
        .output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Lật gương để camera trông tự nhiên nhất */
            transform: scaleX(-1);
            z-index: 1;
        }

        /* Lớp giao diện người dùng nổi lên trên */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Không cản trở tương tác */
        }

        /* Nút bấm ở dưới cùng màn hình */
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: auto; /* Cho phép bấm nút */
        }

        /* Thiết kế nút bấm hiện đại */
        .btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .btn.active {
            background: #ff4757;
            border-color: #ff6b81;
        }

        .btn-capture {
            background: #2ed573;
            border-color: #7bed9f;
        }

        /* Bảng thông báo tác giả */
        .author-notice {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #00d2d3;
            font-weight: bold;
            font-size: 18px;
            color: #00d2d3;
            text-align: center;
            pointer-events: auto;
            animation: fadeInOut 5s forwards;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.5);
        }

        /* Trạng thái Filter đang hoạt động */
        .status-badge {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 165, 0, 0.7);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            display: none;
        }

        /* Animation (A ni mây sần) mờ dần cho thông báo */
        @keyframes fadeInOut {
            0% { opacity: 0; top: 0px; }
            10% { opacity: 1; top: 20px; }
            80% { opacity: 1; top: 20px; }
            100% { opacity: 0; top: 0px; visibility: hidden; }
        }

        /* Hiệu ứng chớp màn hình khi chụp ảnh (Ri u) */
        .flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }

        .flash.active {
            animation: flashAnim 0.5s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <video class="input_video" autoplay playsinline></video>
        <canvas class="output_canvas"></canvas>
        
        <div class="flash" id="flashScreen"></div>

        <div class="ui-layer">
            <div class="author-notice">
                System Initialized<br>
                Author: Kris Artura
            </div>
            
            <div class="status-badge" id="statusBadge">Chế độ: Mặc định</div>

            <div class="controls">
                <button class="btn" id="lockBtn" onclick="toggleLock()">Khoá Filter: TẮT</button>
                <button class="btn btn-capture" onclick="takePhoto()">📷 Chụp Ảnh</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // KHỞI TẠO BIẾN VÀ LẤY CÁC PHẦN TỬ DOM
        // ==========================================
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const lockBtn = document.getElementById('lockBtn');
        const statusBadge = document.getElementById('statusBadge');
        const flashScreen = document.getElementById('flashScreen');

        // Các biến trạng thái quản lý Filter
        let currentFilter = 'NONE'; // Các trạng thái: NONE, BUNNY, MASK
        let isFilterLocked = false;
        
        // Biến lưu thời gian để làm Animation (A ni mây sần)
        let timeOffset = 0;

        // ==========================================
        // CÁC HÀM TOÁN HỌC VÀ TIỆN ÍCH (VECTOR / VẬT LÝ)
        // ==========================================
        
        // Tính khoảng cách giữa 2 điểm 2D
        function calculateDistance(p1, p2) {
            return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
        }

        // Tính góc nghiêng giữa 2 điểm (hữu ích cho việc nghiêng đầu)
        function calculateAngle(p1, p2) {
            return Math.atan2(p2.y - p1.y, p2.x - p1.x);
        }

        // Lấy điểm chính giữa của 2 điểm
        function getMidPoint(p1, p2) {
            return {
                x: (p1.x + p2.x) / 2,
                y: (p1.y + p2.y) / 2
            };
        }

        // ==========================================
        // LOGIC NHẬN DIỆN CỬ CHỈ BÀN TAY
        // ==========================================
        
        // Kiểm tra xem một ngón tay có đang duỗi thẳng không
        // Dựa vào việc đầu ngón tay (tip) có nằm cao hơn khớp ngón (pip) không
        function isFingerExtended(landmarks, tipIndex, pipIndex) {
            // Y trên màn hình: 0 ở trên, 1 ở dưới. 
            // Nếu Y của tip < Y của pip nghĩa là ngón tay đang chĩa lên trên.
            return landmarks[tipIndex].y < landmarks[pipIndex].y;
        }

        // Phân tích toàn bộ bàn tay để suy ra hành động
        function detectHandGesture(handLandmarks) {
            if (!handLandmarks) return 'NONE';

            // Chỉ mục các ngón tay trong MediaPipe Hands
            // Ngón cái: 4, Ngón trỏ: 8, Ngón giữa: 12, Ngón áp út: 16, Ngón út: 20
            const isThumbUp = isFingerExtended(handLandmarks, 4, 3); // Ngón cái hơi đặc biệt
            const isIndexUp = isFingerExtended(handLandmarks, 8, 6);
            const isMiddleUp = isFingerExtended(handLandmarks, 12, 10);
            const isRingUp = isFingerExtended(handLandmarks, 16, 14);
            const isPinkyUp = isFingerExtended(handLandmarks, 20, 18);

            // Đếm số ngón tay đang duỗi (không tính ngón cái cho chính xác với các cử chỉ cơ bản)
            let fingersUpCount = 0;
            if (isIndexUp) fingersUpCount++;
            if (isMiddleUp) fingersUpCount++;
            if (isRingUp) fingersUpCount++;
            if (isPinkyUp) fingersUpCount++;

            // Logic 1: Dơ ✋ (Tất cả các ngón đều mở) -> Xóa hết
            if (fingersUpCount >= 4) {
                return 'STOP';
            }

            // Logic 2: Dơ ✌️ (Ngón trỏ và ngón giữa mở, các ngón khác gập) -> Tai thỏ
            if (isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp) {
                return 'PEACE';
            }

            // Logic 3: Dơ ☝️ (Chỉ có ngón trỏ mở) -> Mặt nạ 3D
            if (isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp) {
                return 'POINT';
            }

            return 'NONE';
        }

        // ==========================================
        // CÁC HÀM VẼ ĐỒ HỌA (FILTER)
        // ==========================================

        // Hàm vẽ Tai Thỏ (Có Animation lắc lư nhẹ)
        function drawBunnyEars(ctx, faceLandmarks, width, height) {
            // Lấy các điểm neo trên khuôn mặt
            const topOfHead = faceLandmarks[10];
            const leftFace = faceLandmarks[234];
            const rightFace = faceLandmarks[454];

            // Tính toán tọa độ thực tế trên Pixel
            const headX = topOfHead.x * width;
            const headY = topOfHead.y * height;
            
            // Tính góc nghiêng của đầu
            const angle = calculateAngle(leftFace, rightFace);
            
            // Kích thước tai phụ thuộc vào độ rộng khuôn mặt
            const faceWidth = calculateDistance(leftFace, rightFace) * width;
            const earWidth = faceWidth * 0.3;
            const earHeight = faceWidth * 0.8;

            // Tạo Animation mượt mà bằng sóng Sin
            timeOffset += 0.05;
            const wobble = Math.sin(timeOffset) * 0.1;

            ctx.save();
            ctx.translate(headX, headY);
            
            // Xoay theo đầu và cộng thêm độ lắc lư
            ctx.rotate(angle + wobble);

            // Vẽ tai trái
            ctx.beginPath();
            ctx.ellipse(-earWidth, -earHeight * 0.6, earWidth/2, earHeight/2, -0.3, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff'; // Màu trắng lông thỏ
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#cccccc';
            ctx.stroke();

            // Phần lõi hồng tai trái
            ctx.beginPath();
            ctx.ellipse(-earWidth, -earHeight * 0.5, earWidth/4, earHeight/3, -0.3, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffb8b8';
            ctx.fill();

            // Vẽ tai phải
            ctx.beginPath();
            ctx.ellipse(earWidth, -earHeight * 0.6, earWidth/2, earHeight/2, 0.3, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.stroke();

            // Phần lõi hồng tai phải
            ctx.beginPath();
            ctx.ellipse(earWidth, -earHeight * 0.5, earWidth/4, earHeight/3, 0.3, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffb8b8';
            ctx.fill();

            ctx.restore();
        }

        // Hàm vẽ Mặt Nạ 3D bao phủ mặt và khoét lỗ mắt
        function drawFaceMask(ctx, faceLandmarks, width, height) {
            // Mảng các điểm bao quanh khuôn mặt (Face Oval)
            const silhouetteIndices = [
                10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288,
                397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136,
                172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109
            ];

            // Mảng điểm mắt trái
            const leftEyeIndices = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
            // Mảng điểm mắt phải
            const rightEyeIndices = [362, 382, 381, 380, 374, 373, 390, 249, 263, 466, 388, 387, 386, 385, 384, 398];

            ctx.save();

            // 1. Vẽ hình dáng mặt nạ (Path bao quanh mặt)
            ctx.beginPath();
            for (let i = 0; i < silhouetteIndices.length; i++) {
                const pt = faceLandmarks[silhouetteIndices[i]];
                if (i === 0) ctx.moveTo(pt.x * width, pt.y * height);
                else ctx.lineTo(pt.x * width, pt.y * height);
            }
            ctx.closePath();

            // Tô màu mặt nạ với độ dốc (Gradient) cho cảm giác 3D
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, "rgba(20, 20, 20, 0.85)");
            grad.addColorStop(1, "rgba(50, 50, 80, 0.85)");
            ctx.fillStyle = grad;
            ctx.fill();

            // Viền mặt nạ phát sáng
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#00ffff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffff";
            ctx.stroke();

            // 2. KHOÉT LỖ MẮT
            // Sử dụng globalCompositeOperation để xóa đi phần đã vẽ
            ctx.globalCompositeOperation = 'destination-out';
            ctx.shadowBlur = 0; // Tắt viền sáng khi cắt lỗ

            // Cắt lỗ mắt trái
            ctx.beginPath();
            for (let i = 0; i < leftEyeIndices.length; i++) {
                const pt = faceLandmarks[leftEyeIndices[i]];
                if (i === 0) ctx.moveTo(pt.x * width, pt.y * height);
                else ctx.lineTo(pt.x * width, pt.y * height);
            }
            ctx.closePath();
            ctx.fill(); // Hành động fill lúc này sẽ "xóa" màu trên Canvas

            // Cắt lỗ mắt phải
            ctx.beginPath();
            for (let i = 0; i < rightEyeIndices.length; i++) {
                const pt = faceLandmarks[rightEyeIndices[i]];
                if (i === 0) ctx.moveTo(pt.x * width, pt.y * height);
                else ctx.lineTo(pt.x * width, pt.y * height);
            }
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // ==========================================
        // HÀM XỬ LÝ SỰ KIỆN TỪ CAMERA & MEDIAPIPE
        // ==========================================
        function onResults(results) {
            // Đảm bảo kích thước Canvas khớp với khung hình Video
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            const w = canvasElement.width;
            const h = canvasElement.height;

            ctx = canvasCtx;
            ctx.save();
            ctx.clearRect(0, 0, w, h);

            // Vẽ hình ảnh nguyên bản từ Camera lên Canvas trước tiên
            ctx.drawImage(results.image, 0, 0, w, h);

            // Nếu hệ thống phát hiện có tay (Trái hoặc Phải)
            let activeGesture = 'NONE';
            if (results.leftHandLandmarks) {
                activeGesture = detectHandGesture(results.leftHandLandmarks);
            } else if (results.rightHandLandmarks) {
                activeGesture = detectHandGesture(results.rightHandLandmarks);
            }

            // Cập nhật trạng thái Filter nếu như chức năng KHOÁ đang TẮT
            if (!isFilterLocked) {
                if (activeGesture === 'PEACE') {
                    currentFilter = 'BUNNY';
                } else if (activeGesture === 'POINT') {
                    currentFilter = 'MASK';
                } else if (activeGesture === 'STOP') {
                    currentFilter = 'NONE';
                }
            }

            // Cập nhật thẻ trạng thái trên màn hình
            statusBadge.style.display = 'block';
            if (currentFilter === 'BUNNY') {
                statusBadge.innerText = 'Chế độ: Tai Thỏ (✌️)';
                statusBadge.style.background = 'rgba(255, 105, 180, 0.8)';
            } else if (currentFilter === 'MASK') {
                statusBadge.innerText = 'Chế độ: Mặt Nạ Cyber (☝️)';
                statusBadge.style.background = 'rgba(0, 206, 209, 0.8)';
            } else {
                statusBadge.innerText = 'Chế độ: Mặc Định (✋ để xoá)';
                statusBadge.style.background = 'rgba(100, 100, 100, 0.8)';
            }

            // Nếu hệ thống tìm thấy khuôn mặt, tiến hành vẽ Filter tương ứng
            if (results.faceLandmarks) {
                if (currentFilter === 'BUNNY') {
                    drawBunnyEars(ctx, results.faceLandmarks, w, h);
                } else if (currentFilter === 'MASK') {
                    drawFaceMask(ctx, results.faceLandmarks, w, h);
                }
                // Lưu ý: Tự động dò khuôn mặt (ẩn), nên ta KHÔNG dùng hàm 
                // drawConnectors() để vẽ lưới FaceMesh mặc định.
            }

            ctx.restore();
        }

        // ==========================================
        // CÁC HÀM XỬ LÝ GIAO DIỆN NÚT BẤM
        // ==========================================

        // Hàm bật/tắt chức năng khoá Filter
        function toggleLock() {
            isFilterLocked = !isFilterLocked;
            if (isFilterLocked) {
                lockBtn.innerText = 'Khoá Filter: BẬT';
                lockBtn.classList.add('active');
            } else {
                lockBtn.innerText = 'Khoá Filter: TẮT';
                lockBtn.classList.remove('active');
            }
        }

        // Hàm chụp ảnh thực (Ri u) chất lượng cao
        function takePhoto() {
            // Kích hoạt Animation chớp trắng
            flashScreen.classList.remove('active');
            void flashScreen.offsetWidth; // Mẹo nhỏ để kích hoạt lại CSS Animation
            flashScreen.classList.add('active');

            // Tạo link tải ảnh xuống thiết bị
            const link = document.createElement('a');
            link.download = 'KrisArtura_AR_Filter.png';
            
            // Do Canvas bị lật ngược bằng CSS, nếu muốn ảnh tải về không bị lật
            // ta cần lật lại nó trước khi xuất file (hoặc xuất nguyên bản)
            // Ở đây xuất ảnh y hệt như những gì người dùng đang nhìn thấy
            
            // Tạo một Canvas tạm thời để xử lý lật ảnh
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasElement.width;
            tempCanvas.height = canvasElement.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            // Lật ngược hệ trục tọa độ ngang
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            
            // Vẽ Canvas chính lên Canvas tạm
            tempCtx.drawImage(canvasElement, 0, 0);

            // Chuyển thành file PNG và ép trình duyệt tải xuống
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

        // ==========================================
        // CẤU HÌNH VÀ KHỞI ĐỘNG HỆ THỐNG MEDIAPIPE
        // ==========================================
        
        // Cấu hình Holistic: Dò tìm đồng thời Mặt, Tay và Cơ thể
        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1,       // Giữ ở mức 1 để tránh giật lag
            smoothLandmarks: true,    // Làm mượt chuyển động, chống rung
            enableSegmentation: false,
            smoothSegmentation: false,
            refineFaceLandmarks: true,// Tăng độ chính xác cho môi và mắt (để khoét lỗ)
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // Đăng ký sự kiện: mỗi khi có khung hình xử lý xong thì gọi onResults
        holistic.onResults(onResults);

        // Kích hoạt Camera mặt trước (facingMode: 'user')
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await holistic.send({image: videoElement});
            },
            width: 1280,
            height: 720,
            facingMode: 'user'
        });

        // Bắt đầu chạy Camera
        camera.start();

    </script>
</body>
</html>
