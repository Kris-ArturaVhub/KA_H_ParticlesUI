<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Filter by Kris Artura V2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        /* Thiết lập giao diện toàn màn hình */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Video ẩn, giảm tải hiển thị */
        .input_video {
            display: none;
            position: absolute;
        }

        /* Can vát (Canvas) hiển thị Phin tờ (Filter) */
        .output_canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Lật gương */
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Tác giả Kris Artura */
        .author-notice {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-weight: bold;
            font-size: 14px;
        }

        /* Nút điều khiển */
        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            pointer-events: auto;
        }

        .btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid white;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-capture {
            background: #ff4757;
            border-color: #ff4757;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        /* Bảng hướng dẫn */
        .tutorial-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #2ed573;
            text-align: center;
            z-index: 50;
            pointer-events: auto;
            width: 80%;
            max-width: 350px;
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.4);
        }

        .tutorial-overlay h2 {
            margin-top: 0;
            color: #2ed573;
        }

        .tutorial-list {
            text-align: left;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .start-btn {
            background: #2ed573;
            color: black;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Flash khi chụp ảnh */
        .flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }

        .flash.active {
            animation: flashAnim 0.4s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <video class="input_video" autoplay playsinline></video>
        <canvas class="output_canvas"></canvas>
        
        <div class="flash" id="flashScreen"></div>

        <div class="ui-layer">
            <div class="author-notice">By Kris Artura</div>
            
            <div class="controls">
                <button class="btn" id="lockBtn" onclick="toggleLock()">🔒 Mở khoá</button>
                <button class="btn btn-capture" onclick="takePhoto()">📸 Chụp Ảnh</button>
            </div>
        </div>

        <div class="tutorial-overlay" id="tutorial">
            <h2>HƯỚNG DẪN</h2>
            <div class="tutorial-list">
                ✌️ <b>Dơ 2 ngón:</b> Tai thỏ vật lý<br>
                ☝️ <b>Chỉ ngón trỏ:</b> Mặt nạ Cyber<br>
                🤘 <b>Dơ sừng:</b> Vẽ dạ quang bằng mũi<br>
                ✋ <b>Xoè tay:</b> Xoá toàn bộ
            </div>
            <button class="start-btn" onclick="closeTutorial()">Bắt đầu ngay</button>
        </div>
    </div>

    <script>
        // Lấy các phần tử từ DOM
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const flashScreen = document.getElementById('flashScreen');
        const lockBtn = document.getElementById('lockBtn');
        const tutorial = document.getElementById('tutorial');

        // Các biến trạng thái
        let currentFilter = 'NONE';
        let isFilterLocked = false;
        
        // Quản lý nét vẽ mũi
        let noseTrail = [];
        const MAX_TRAIL_LENGTH = 40; // Giới hạn độ dài để không lác

        // Quản lý vật lý tai thỏ
        let prevHeadX = 0;
        let earInertia = 0; // Quán tính

        function closeTutorial() {
            tutorial.style.display = 'none';
        }

        function toggleLock() {
            isFilterLocked = !isFilterLocked;
            lockBtn.innerText = isFilterLocked ? '🔒 Đã Khoá' : '🔒 Mở khoá';
            lockBtn.style.borderColor = isFilterLocked ? '#ff4757' : 'white';
        }

        // ==========================================
        // TOÁN HỌC VÀ NHẬN DIỆN CỬ CHỈ MỚI (CHỐNG LÁC)
        // ==========================================
        
        // Hàm tính khoảng cách 2 điểm
        function dist(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // Nhận diện siêu chuẩn dựa trên khoảng cách tới cổ tay
        // Tránh lỗi khi nghiêng tay, lật tay
        function detectHandGesture(landmarks) {
            if (!landmarks) return 'NONE';

            // Cổ tay là điểm số 0
            const wrist = landmarks[0];
            
            // Tính khoảng cách ngón tay so với cổ tay
            const indexExtended = dist(landmarks[8], wrist) > dist(landmarks[5], wrist) * 1.2;
            const middleExtended = dist(landmarks[12], wrist) > dist(landmarks[9], wrist) * 1.2;
            const ringExtended = dist(landmarks[16], wrist) > dist(landmarks[13], wrist) * 1.2;
            const pinkyExtended = dist(landmarks[20], wrist) > dist(landmarks[17], wrist) * 1.2;

            // ✋ Xoè tay (4 ngón dơ lên) -> DỪNG/XOÁ
            if (indexExtended && middleExtended && ringExtended && pinkyExtended) {
                return 'STOP';
            }

            // ✌️ Dơ 2 ngón (Trỏ & Giữa) -> TAI THỎ
            if (indexExtended && middleExtended && !ringExtended && !pinkyExtended) {
                return 'PEACE';
            }

            // ☝️ Dơ ngón trỏ -> MẶT NẠ
            if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
                return 'POINT';
            }

            // 🤘 Dơ sừng (Trỏ & Út) -> VẼ BẰNG MŨI
            if (indexExtended && !middleExtended && !ringExtended && pinkyExtended) {
                return 'ROCK';
            }

            return 'NONE';
        }

        // ==========================================
        // CÁC HÀM VẼ ĐỒ HỌA
        // ==========================================

        // Vẽ đường nét bằng mũi (Neon dạ quang)
        function drawNoseTrail(ctx, width, height) {
            if (noseTrail.length < 2) return;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(noseTrail[0].x, noseTrail[0].y);

            for (let i = 1; i < noseTrail.length; i++) {
                // Tạo đường cong mượt mà
                const xc = (noseTrail[i].x + noseTrail[i - 1].x) / 2;
                const yc = (noseTrail[i].y + noseTrail[i - 1].y) / 2;
                ctx.quadraticCurveTo(noseTrail[i - 1].x, noseTrail[i - 1].y, xc, yc);
            }

            // Hiệu ứng phát sáng
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();

            // Vẽ viền lõi trắng
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.shadowBlur = 0;
            ctx.stroke();

            ctx.restore();
        }

        // Vẽ tai thỏ với A ni mây sần (Animation) vật lý
        function drawAnimatedBunnyEars(ctx, faceLandmarks, width, height) {
            const topOfHead = faceLandmarks[10];
            const leftFace = faceLandmarks[234];
            const rightFace = faceLandmarks[454];

            const headX = topOfHead.x * width;
            const headY = topOfHead.y * height;
            
            // Tính toán tốc độ chuyển động của đầu
            const headSpeed = headX - prevHeadX;
            prevHeadX = headX;

            // Quán tính đàn hồi (Lắc theo chiều ngược lại của đầu)
            // Lực kéo về vị trí 0
            earInertia += (headSpeed * 0.02 - earInertia) * 0.15;

            const faceWidth = dist(leftFace, rightFace) * width;
            const earWidth = faceWidth * 0.25;
            const earHeight = faceWidth * 0.8;

            ctx.save();
            ctx.translate(headX, headY);
            
            // Xoay thêm quán tính vật lý
            const baseAngle = Math.atan2(rightFace.y - leftFace.y, rightFace.x - leftFace.x);
            ctx.rotate(baseAngle + earInertia);

            // Vẽ tai trái (Cụp ra một chút)
            ctx.save();
            ctx.rotate(-0.3);
            drawSingleEar(ctx, -earWidth * 1.5, -earHeight * 0.6, earWidth, earHeight);
            ctx.restore();

            // Vẽ tai phải
            ctx.save();
            ctx.rotate(0.3);
            drawSingleEar(ctx, earWidth * 1.5, -earHeight * 0.6, earWidth, earHeight);
            ctx.restore();

            ctx.restore();
        }

        // Hàm hỗ trợ vẽ một bên tai
        function drawSingleEar(ctx, x, y, w, h) {
            // Lông thỏ trắng
            ctx.beginPath();
            ctx.ellipse(x, y, w/2, h/2, 0, 0, 2 * Math.PI);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ddd';
            ctx.stroke();

            // Lõi tai hồng
            ctx.beginPath();
            ctx.ellipse(x, y + h*0.1, w/3, h/2.5, 0, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff99cc';
            ctx.fill();
        }

        // Vẽ Mặt Nạ đơn giản hơn bản cũ để tránh lác
        function drawFastMask(ctx, faceLandmarks, width, height) {
            const nose = faceLandmarks[1];
            const leftJaw = faceLandmarks[132];
            const rightJaw = faceLandmarks[361];
            const chin = faceLandmarks[152];

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(leftJaw.x * width, leftJaw.y * height);
            ctx.lineTo(chin.x * width, chin.y * height);
            ctx.lineTo(rightJaw.x * width, rightJaw.y * height);
            ctx.lineTo(nose.x * width, (nose.y - 0.05) * height);
            ctx.closePath();

            // Gradient màu ngầu
            const grad = ctx.createLinearGradient(0, chin.y*height, 0, nose.y*height);
            grad.addColorStop(0, "rgba(10, 10, 10, 0.9)");
            grad.addColorStop(1, "rgba(50, 0, 100, 0.6)");
            ctx.fillStyle = grad;
            ctx.fill();

            // Lưới điện Cyber
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(nose.x * width, nose.y * height);
            ctx.lineTo(chin.x * width, chin.y * height);
            ctx.stroke();

            ctx.restore();
        }

        // ==========================================
        // XỬ LÝ DỮ LIỆU TỪ MEDIAPIPE CHÍNH
        // ==========================================
        function onResults(results) {
            const w = canvasElement.width;
            const h = canvasElement.height;
            const ctx = canvasCtx;

            ctx.save();
            ctx.clearRect(0, 0, w, h);

            // Vẽ hình từ Ca me ra
            ctx.drawImage(results.image, 0, 0, w, h);

            // Dò tìm cử chỉ tay
            let activeGesture = 'NONE';
            let handDetected = false;

            if (results.leftHandLandmarks) {
                activeGesture = detectHandGesture(results.leftHandLandmarks);
                handDetected = true;
            } else if (results.rightHandLandmarks) {
                activeGesture = detectHandGesture(results.rightHandLandmarks);
                handDetected = true;
            }

            // Xử lý logic Phin tờ (Filter) nếu không khoá
            if (!isFilterLocked) {
                if (activeGesture === 'PEACE') currentFilter = 'BUNNY';
                else if (activeGesture === 'POINT') currentFilter = 'MASK';
                else if (activeGesture === 'ROCK') currentFilter = 'DRAW';
                else if (activeGesture === 'STOP') currentFilter = 'NONE';
            }

            // Xử lý Xoá đường nét vẽ nếu thả tay hoặc dơ STOP
            if (currentFilter !== 'DRAW' || activeGesture === 'STOP' || !handDetected) {
                // Giảm từ từ độ dài mảng để tia sáng ngắn dần (hiệu ứng đẹp)
                if (noseTrail.length > 0) {
                    noseTrail.shift();
                    noseTrail.shift(); // Xoá nhanh gấp đôi
                }
            }

            // Vẽ theo chế độ
            if (results.faceLandmarks) {
                if (currentFilter === 'DRAW' && handDetected && activeGesture === 'ROCK') {
                    // Thêm toạ độ mũi vào mảng vẽ
                    const nose = results.faceLandmarks[1];
                    noseTrail.push({x: nose.x * w, y: nose.y * h});
                    
                    // Xoá điểm cũ nếu dài quá giới hạn
                    if (noseTrail.length > MAX_TRAIL_LENGTH) {
                        noseTrail.shift();
                    }
                }

                // Vẽ các hiệu ứng lên Can vát
                if (currentFilter === 'BUNNY') {
                    drawAnimatedBunnyEars(ctx, results.faceLandmarks, w, h);
                } else if (currentFilter === 'MASK') {
                    drawFastMask(ctx, results.faceLandmarks, w, h);
                }

                // Luôn vẽ tia nét mũi nếu mảng còn dữ liệu
                if (noseTrail.length > 0) {
                    drawNoseTrail(ctx, w, h);
                }
            }

            ctx.restore();
        }

        // ==========================================
        // CHỤP ẢNH VÀ KHỞI ĐỘNG HỆ THỐNG
        // ==========================================

        function takePhoto() {
            // Nháy Flash
            flashScreen.classList.remove('active');
            void flashScreen.offsetWidth; 
            flashScreen.classList.add('active');

            // Tạo Can vát tạm để lật ảnh (Do CSS đang lật gương)
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvasElement.width;
            tempCanvas.height = canvasElement.height;
            const tempCtx = tempCanvas.getContext('2d');
            
            tempCtx.translate(tempCanvas.width, 0);
            tempCtx.scale(-1, 1);
            tempCtx.drawImage(canvasElement, 0, 0);

            // Lưu file
            const link = document.createElement('a');
            link.download = 'KrisArtura_AR.png';
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
        }

        // Khởi tạo Holistic (Cấu hình chống lác)
        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 0,       // GIẢM XUỐNG 0 ĐỂ HẾT LÁC
            smoothLandmarks: true,
            enableSegmentation: false,
            refineFaceLandmarks: false, // Bỏ refine để tối ưu hiệu suất
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        // Chạy Camera độ phân giải tiêu chuẩn (Chống lác cho mobile)
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await holistic.send({image: videoElement});
            },
            width: 640,  // Nâng hiệu suất rõ rệt
            height: 480,
            facingMode: 'user'
        });

        camera.start();
    </script>
</body>
</html>
