<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>AI Filter Fixed</title>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

#guide {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  color: white;
  z-index: 10;
  font-size: 14px;
}

#btn {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  background: cyan;
  border-radius: 10px;
  z-index: 10;
}

video, canvas {
  position: absolute;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}
</style>
</head>

<body>

<div id="guide">
👉 Cho phép camera<br>
✌️ Tai thỏ | ✋ Kính | ☝️ Mặt nạ | ✊ Xoá
</div>

<button id="btn">📸 Chụp</button>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("btn");

let filter = "none";
let tick = 0;

// ===== CAMERA (FIX LẬT + FULL) =====
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "user" }
}).then(stream => {
  video.srcObject = stream;
});

// ===== LOAD MODEL =====
Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/weights'),
  faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/weights')
]).then(start);

// ===== HAND =====
const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(res => {
  if (!res.multiHandLandmarks) return;

  const lm = res.multiHandLandmarks[0];

  const i = lm[8].y < lm[6].y;
  const m = lm[12].y < lm[10].y;
  const r = lm[16].y < lm[14].y;
  const p = lm[20].y < lm[18].y;

  if (i && m && !r && !p) filter = "bunny";
  else if (i && m && r && p) filter = "glasses";
  else if (i && !m && !r && !p) filter = "mask";
  else if (!i && !m && !r && !p) filter = "none";
});

// ===== START LOOP (FIX HAND KHÔNG CHẠY) =====
function start() {
  video.addEventListener("loadeddata", () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    loop();
  });
}

// ===== MAIN LOOP =====
async function loop() {
  await hands.send({ image: video }); // 🔥 FIX CHÍNH

  const face = await faceapi.detectSingleFace(video)
    .withFaceLandmarks();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 🔥 LẬT NGANG CHO ĐÚNG GƯƠNG
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  ctx.restore();

  if (face) {
    const lm = face.landmarks;
    const left = lm.getLeftEye()[0];
    const right = lm.getRightEye()[3];
    const jaw = lm.getJawOutline();

    tick += 0.1;

    if (filter === "bunny") drawBunny(left, right);
    if (filter === "glasses") drawGlasses(left, right);
    if (filter === "mask") drawMask(jaw, left, right);
  }

  requestAnimationFrame(loop);
}

// ===== FILTER =====
function drawBunny(l, r) {
  const midX = (l.x + r.x) / 2;
  const y = Math.min(l.y, r.y) - 80;
  const b = Math.sin(tick) * 10;

  ctx.fillStyle = "pink";
  ctx.fillRect(midX - 40, y + b, 20, 80);
  ctx.fillRect(midX + 20, y + b, 20, 80);
}

function drawGlasses(l, r) {
  const g = Math.sin(tick * 2) * 2;

  ctx.strokeStyle = "cyan";
  ctx.lineWidth = 5 + g;

  ctx.strokeRect(l.x - 30, l.y - 20, 60, 40);
  ctx.strokeRect(r.x - 30, r.y - 20, 60, 40);

  ctx.beginPath();
  ctx.moveTo(l.x + 30, l.y);
  ctx.lineTo(r.x - 30, r.y);
  ctx.stroke();
}

function drawMask(jaw, l, r) {
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.beginPath();
  jaw.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.fill();

  ctx.clearRect(l.x - 35, l.y - 25, 70, 50);
  ctx.clearRect(r.x - 35, r.y - 25, 70, 50);
}

// ===== CAPTURE =====
btn.onclick = () => {
  const a = document.createElement("a");
  a.href = canvas.toDataURL();
  a.download = "photo.png";
  a.click();
};
</script>

</body>
</html>
